<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — FlatMate</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/bot.css" />
</head>
<body>
    <div class="auth-page" style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--color-bg);">
        <div class="auth-card" style="max-width:400px; width:100%; background:white; padding:3rem; border-radius:var(--radius); border:1px solid var(--color-border);">
            <h1 style="font-family:var(--font-serif); font-size:2.2rem; margin-bottom:0.5rem;">Welcome back</h1>
            <p style="color:#666; margin-bottom:2rem;">Sign in to your FlatMate account.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" />
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
            </form>
            <p style="margin-top:1.5rem; text-align:center; font-size:0.95rem;">
                Don't have an account? <a href="/register.html" style="font-weight:600; color:var(--color-accent);">Create one</a>
            </p>
            <p style="text-align:center; font-size:0.9rem; margin-top:0.5rem;"><a href="/forgot-password.html">Forgot password?</a></p>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="/js/config.js"></script>
    <script src="/js/validate.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/bot.js"></script>
    <script src="/js/password-toggle.js"></script>
</body>
</html>
